<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0b0b">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<title>Crea tu agente — Sendell</title>
<style>
  :root {
    color-scheme: dark;
    --fondo: #0b0b0b; --tinta: #f2f2f2; --tenue: #a8a8a8; --raya: #3a3a3a; --caja: #141414; --error: #ffb3a7;
    --mono: "Nimbus Mono PS", "Courier New", "DejaVu Sans Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--fondo); color: var(--tinta); font-family: var(--mono); }
  body { font-size: 16px; line-height: 1.5; -webkit-text-size-adjust: 100%; }
  button, input, textarea { font: inherit; color: inherit; }
  .sr { position: absolute !important; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  :focus-visible { outline: 2px solid var(--tinta); outline-offset: 3px; }
  [hidden] { display: none !important; }

  .saltar { position: absolute; left: 8px; top: -60px; background: var(--tinta); color: var(--fondo); padding: 8px 12px; z-index: 5; }
  .saltar:focus { top: 8px; }

  header { display: flex; align-items: center; gap: 12px; padding: 14px 16px 8px; max-width: 1040px; margin: 0 auto; }
  header .marca { font-weight: bold; letter-spacing: .14em; font-size: 14px; }
  header h1 { font-size: 14px; font-weight: normal; color: var(--tenue); margin: 0; flex: 1; }
  #idioma { background: none; border: 1px solid var(--raya); border-radius: 999px; padding: 6px 12px; min-height: 36px; cursor: pointer; font-size: 13px; }
  #idioma:hover { border-color: var(--tinta); }

  .marco { max-width: 1040px; margin: 0 auto; padding: 0 16px 32px; }
  #progreso { margin: 4px 0 10px; }
  #progreso-texto { margin: 0 0 6px; font-size: 13px; color: var(--tenue); font-variant-numeric: tabular-nums; }
  .barra { height: 3px; background: var(--raya); border-radius: 2px; overflow: hidden; }
  #progreso-barra { display: block; height: 100%; background: var(--tinta); width: 0; transition: width .35s ease; }

  #escena { margin: 0 -16px; }
  #lienzo { display: block; width: 100%; }

  .tarjeta { padding: 8px 0 0; }
  h2 { font-size: 21px; line-height: 1.3; margin: 8px 0 6px; }
  h2:focus { outline: none; }
  h2:focus-visible { outline: 2px solid var(--tinta); }
  h3 { font-size: 15px; margin: 24px 0 8px; letter-spacing: .04em; }
  .ayuda, .lead { color: var(--tenue); margin: 0 0 18px; }
  .lead { color: var(--tinta); }
  .puntos { padding-left: 1.2em; margin: 0 0 8px; }
  .puntos li { margin: 6px 0; }

  .campo { margin: 0 0 18px; }
  label, legend { display: block; font-weight: bold; margin: 0 0 6px; }
  .opc { font-weight: normal; color: var(--tenue); }
  input[type=text], input:not([type]), textarea {
    width: 100%; background: var(--caja); border: 1px solid var(--raya); border-radius: 6px; padding: 12px; min-height: 48px; font-size: 16px;
  }
  textarea { resize: vertical; line-height: 1.45; }
  input::placeholder, textarea::placeholder { color: #8f8f8f; opacity: 1; }
  input:focus, textarea:focus { border-color: var(--tinta); }
  [aria-invalid=true] { border-color: var(--error) !important; }
  .error { color: var(--error); margin: 6px 0 0; font-size: 14px; }
  .error::before { content: "! "; font-weight: bold; }

  fieldset.grupo { border: 0; padding: 0; margin: 0 0 20px; min-width: 0; }
  fieldset.sin-leyenda > legend { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .opciones { display: grid; gap: 8px; }
  .dos .opciones { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .tres .opciones { grid-template-columns: repeat(3, 1fr); }
  .opcion { display: flex; align-items: center; gap: 10px; margin: 0; font-weight: normal; cursor: pointer;
    border: 1px solid var(--raya); border-radius: 6px; padding: 10px 12px; min-height: 48px; background: var(--caja); }
  .opcion:hover { border-color: #777; }
  .opcion:has(input:checked) { border-color: var(--tinta); background: #1d1d1d; }
  .opcion:has(input:focus-visible) { outline: 2px solid var(--tinta); outline-offset: 2px; }
  .opcion input { accent-color: var(--tinta); width: 18px; height: 18px; margin: 0; flex: none; }
  .opcion input:focus-visible { outline: none; }

  .tabla-autonomia fieldset.segmento { margin: 0 0 14px; }
  .segmento legend { font-weight: normal; }
  .segmento .opciones { grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .segmento .opcion { justify-content: center; padding: 8px 6px; font-size: 14px; text-align: center; gap: 6px; }

  .formas .opciones { grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); }
  .formas .opcion { font-size: 14px; padding: 8px 10px; }
  fieldset.familia { border: 0; padding: 0; margin: 0 0 14px; min-width: 0; }
  fieldset.familia legend { font-weight: normal; font-size: 13px; color: var(--tenue); letter-spacing: .06em; text-transform: uppercase; }
  .colores .opciones { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
  .muestra { width: 18px; height: 18px; border-radius: 50%; background: var(--muestra); flex: none; box-shadow: 0 0 0 1px #000 inset; }

  .subtitulo { margin: 4px 0 8px; color: var(--tenue); }
  .fichas-ej { list-style: none; margin: 0 0 18px; padding: 0; display: grid; gap: 8px; }
  .fichas-ej.cortas { display: flex; flex-wrap: wrap; }
  .chip { width: 100%; text-align: left; background: none; border: 1px dashed #5a5a5a; border-radius: 6px; padding: 10px 12px; min-height: 44px; cursor: pointer; font-size: 14px; }
  .cortas .chip { width: auto; }
  .chip:hover { border-color: var(--tinta); border-style: solid; }
  .detalle { color: var(--tenue); margin: -8px 0 18px; min-height: 1.5em; }
  .nota { color: var(--tenue); font-size: 14px; }
  .casilla .opcion { align-items: flex-start; }
  .casilla .opcion input { margin-top: 3px; }

  .acciones { display: flex; gap: 10px; justify-content: space-between; margin: 26px 0 8px; flex-wrap: wrap; }
  .acciones button { min-height: 48px; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; }
  .primario { background: var(--tinta); color: var(--fondo); border: 1px solid var(--tinta); margin-left: auto; }
  .primario:hover { background: #fff; }
  .primario:disabled { opacity: .6; cursor: wait; }
  .secundario { background: none; border: 1px solid var(--raya); }
  .secundario:hover { border-color: var(--tinta); }
  .enlace { background: none; border: 0; padding: 2px 0; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; color: var(--tenue); font-size: 14px; min-height: 32px; }
  .enlace:hover { color: var(--tinta); }

  .carnet { display: grid; grid-template-columns: minmax(0, 1fr); gap: 4px; border: 1px solid var(--raya); border-radius: 10px; padding: 12px; margin: 8px 0 16px; background: #0e0e0e; }
  .carnet-avatar { width: 100%; }
  .carnet-avatar canvas { display: block; width: 100%; }
  .carnet-id { text-align: center; }
  .nombre-agente { color: var(--agente); font-weight: bold; font-size: 24px; margin: 0; overflow-wrap: anywhere; }
  .apariencia { margin: 2px 0; color: var(--tenue); }
  .carnet-id .enlace { margin: 0 8px; }
  .aprende { border-left: 2px solid var(--tinta); padding-left: 12px; }
  dl.datos { margin: 0; }
  dl.datos dt { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--tenue); margin: 14px 0 2px; }
  dl.datos dd { margin: 0; display: flex; gap: 12px; align-items: baseline; justify-content: space-between; border-bottom: 1px solid #222; padding: 0 0 8px; }
  dl.datos .valor { white-space: pre-wrap; overflow-wrap: anywhere; }
  dl.datos .enlace { flex: none; }
  .despues { padding-left: 1.4em; }
  .despues li { margin: 6px 0; }

  footer { max-width: 1040px; margin: 0 auto; padding: 8px 16px 40px; color: var(--tenue); font-size: 13px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
  #reiniciar { background: none; border: 0; color: var(--tenue); text-decoration: underline; cursor: pointer; padding: 6px 0; font-size: 13px; }

  dialog { background: var(--fondo); color: var(--tinta); border: 1px solid var(--raya); border-radius: 10px; padding: 18px; width: min(680px, calc(100vw - 32px)); max-height: calc(100vh - 48px); }
  dialog::backdrop { background: rgba(0, 0, 0, .75); }
  dialog pre { background: var(--caja); border: 1px solid var(--raya); border-radius: 6px; padding: 12px; overflow: auto; max-height: 50vh; font-size: 12.5px; white-space: pre-wrap; overflow-wrap: anywhere; }
  dialog .acciones { margin-top: 12px; }

  /* Pantalla ancha: Sendell a la izquierda, fijo; la pregunta a la derecha. */
  @media (min-width: 860px) {
    .marco { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 40px; align-items: start; }
    #progreso { grid-column: 1 / -1; }
    #escena { position: sticky; top: 16px; margin: 0; border: 1px solid #1c1c1c; border-radius: 10px; overflow: hidden; }
    body.en-ficha .marco { grid-template-columns: minmax(0, 720px); justify-content: center; }
    .carnet { grid-template-columns: 220px 1fr; align-items: center; }
    .carnet-id { text-align: left; }
    .carnet-id .enlace { margin: 0 16px 0 0; }
    h2 { font-size: 24px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; scroll-behavior: auto !important; }
  }
  @media (forced-colors: active) {
    .opcion:has(input:checked) { outline: 2px solid CanvasText; }
  }
</style>
</head>
<body>
<a class="saltar" href="#pantalla">Saltar a la pregunta</a>
<header>
  <span class="marca" aria-hidden="true">SENDELL</span>
  <h1 id="titulo-sitio">Crea tu agente</h1>
  <button type="button" id="idioma">English</button>
</header>
<main class="marco">
  <div id="progreso" hidden>
    <p id="progreso-texto"></p>
    <div class="barra" aria-hidden="true"><span id="progreso-barra"></span></div>
  </div>
  <div id="escena">
    <canvas id="lienzo" role="img" aria-label="Sendell, un personaje hecho de ceros."></canvas>
  </div>
  <div id="pantalla">
    <noscript><p>Esta página necesita JavaScript para crear tu agente.</p></noscript>
  </div>
</main>
<footer>
  <span id="guardado"></span>
  <button type="button" id="reiniciar">Empezar de nuevo</button>
</footer>
<p id="aviso" class="sr" role="status" aria-live="polite"></p>
<dialog id="resultado" aria-labelledby="resultado-titulo">
  <h2 id="resultado-titulo"></h2>
  <p id="resultado-texto" class="ayuda"></p>
  <pre id="resultado-json" tabindex="0"></pre>
  <p id="resultado-copiado" role="status" class="nota"></p>
  <div class="acciones">
    <button type="button" id="resultado-copiar" class="secundario"></button>
    <button type="button" id="resultado-cerrar" class="primario"></button>
  </div>
</dialog>
<script type="module" src="./app.mjs"></script>
</body>
</html>
